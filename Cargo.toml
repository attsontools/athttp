[package]
name = "athttp-service"
version = "0.1.0-alpha.0"
edition = "2021"

[lib]
name = "athttp_service"
path = "src/lib.rs"

[dependencies]
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
